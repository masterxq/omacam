# Lens table for the Motorola Moto G60s (lisbon, MediaTek MT6785) running
# mainline Linux, in the same format as data/cheetah.toml, which explains
# every field. Chosen when the device tree says motorola,lisbon.
#
# Three cameras have drivers so far: the OmniVision OV64B40 at the back,
# with a focus motor, the OmniVision OV16A1Q at the front, and the Samsung
# S5K5E9 macro camera at the back. The back's zoom ladder has one lens and
# zoom is digital: a crop of the main camera's frames. The macro camera
# stays off the ladder; its button turns it on, as a magnifier.
#
# preview/still: the sensor modes libcamera offers. OV64B40: 2304x1728 and
#   4624x3472, OV16A1Q: 2304x1728 alone, S5K5E9: 2592x1940 alone (its
#   preview is the ISP's scaled output of the same frames, half the size). Each shows the sensor's whole
#   field of view, hence coverage [1, 1]. libcamera may adjust the sizes
#   (the software ISP leaves a few columns at the edge); the app uses what
#   it gets.
# video: the back camera's video stream, 16:9 of the 4624x3472 mode's whole
#   width scaled to 1920x1080 by the ISP: video mode streams it instead of
#   the preview, so videos keep the full width and the CPU neither crops nor
#   scales. With the still mode's stream beside the 2304x1728 preview,
#   photos come from the running preview (no lens table entry: the app asks
#   libcamera, and falls back when the camera can't).
# rotation: left out, libcamera's Rotation property comes from the device
#   tree.
# base_iso: 100, the convention of the camera's tuning (ISO = 100 x total
#   gain), which matches what the stock firmware records for the same
#   exposure.
# f_number, focal lengths: left out until measured.
# autofocus: the S5K5E9 has a fixed focus, sharp at a few centimeters.
# max_zoom: 4, where a crop of the 4624x3472 mode still keeps 1156x868.
# bursts: false. The camera's pipeline merges a series of frames of its own
#   for each photo on the still stream, at an exposure of its own, and each
#   of those frames takes about 1.2 s: the app's Night and HDR bursts never
#   get the exposure they ask for. The camera's merge stands in for them;
#   Night and HDR stay hidden.

device = "lisbon"
max_zoom = 4.0
bursts = false

[[lens]]
role = "main"
name = "Main"
id = "/base/soc/i2c@11009000/camera@22" # OmniVision OV64B40
zoom = 1.0
preview = [2304, 1728]
still = [4624, 3472]
video = [1920, 1080]
coverage = [1.0, 1.0]
base_iso = 100
autofocus = true

[[lens]]
role = "front"
name = "Front"
id = "/base/soc/i2c@11011000/camera@10" # OmniVision OV16A1Q
zoom = 1.0
preview = [2304, 1728]
still = [2304, 1728]
coverage = [1.0, 1.0]
base_iso = 100
autofocus = false
mirror = true

[[lens]]
role = "macro"
name = "Macro"
id = "/base/soc/i2c@1101a000/camera@10" # Samsung S5K5E9
zoom = 1.0
preview = [1296, 970]
still = [2592, 1940]
coverage = [1.0, 1.0]
base_iso = 100
autofocus = false
